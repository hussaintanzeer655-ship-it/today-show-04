<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Today Show Timeline</title><style>:root{--bg:#f7f7fb;--fg:#111;--card:#fff;--line:#d1d5db;--accent:#374151} body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial, sans-serif} header{padding:14px 16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0} .timeline{max-width:900px;margin:20px auto;padding:0 16px} .entry{position:relative;padding-left:40px;margin:18px 0} .entry:before{content:'';position:absolute;left:14px;top:6px;width:12px;height:12px;background:var(--accent);border-radius:50%;border:2px solid #fff} .time{font-size:12px;color:#555} .card{background:#fff;border-radius:8px;padding:12px;border:1px solid #eee} @media (max-width:600px){.entry{padding-left:24px}} </style></head><body><header><strong>Today Show</strong></header><section class="timeline" id="tl"></section><script>const items=[{t:'08:00',m:'Morning briefing'},{t:'12:00',m:'Midday highlights'},{t:'18:00',m:'Evening recap'}];const tl=document.getElementById('tl');items.forEach(i=>{tl.insertAdjacentHTML('beforeend','<div class=\"entry\"><div class=\"card\"><div class=\"time\">'+i.t+'</div><div>'+i.m+'</div></div></div>')});</script></body></html>
